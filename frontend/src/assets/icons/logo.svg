<svg
        width="256"
        height="256"
        viewBox="0 0 256 256"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
>
    <defs>
        <linearGradient id="blue" x1="52" y1="35" x2="205" y2="220" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0B3FAE"/>
            <stop offset="0.5" stop-color="#0878E8"/>
            <stop offset="1" stop-color="#00B8F0"/>
        </linearGradient>

        <linearGradient id="darkBlue" x1="128" y1="30" x2="128" y2="220" gradientUnits="userSpaceOnUse">
            <stop stop-color="#102E68"/>
            <stop offset="1" stop-color="#061A40"/>
        </linearGradient>

        <linearGradient id="gold" x1="170" y1="55" x2="210" y2="150" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFD84A"/>
            <stop offset="1" stop-color="#F5A900"/>
        </linearGradient>

        <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow
                    dx="0"
                    dy="8"
                    stdDeviation="8"
                    flood-opacity="0.18"
            />
        </filter>
    </defs>

    <!-- Graduation cap -->
    <path
            d="M128 28L224 70L128 112L32 70L128 28Z"
            fill="url(#blue)"
            filter="url(#shadow)"
    />

    <!-- Cap underside -->
    <path
            d="M67 86V105C67 119 94 133 128 133C162 133 189 119 189 105V86L128 112L67 86Z"
            fill="url(#darkBlue)"
    />

    <!-- Tassel -->
    <path
            d="M205 67V111"
            stroke="url(#gold)"
            stroke-width="7"
            stroke-linecap="round"
    />

    <circle
            cx="205"
            cy="67"
            r="8"
            fill="#FFD84A"
    />

    <path
            d="M198 111H212L216 145C216.8 151.5 211.7 157 205 157C198.3 157 193.2 151.5 194 145L198 111Z"
            fill="url(#gold)"
    />

    <!-- Big S -->
    <path
            d="
      M158 91
      C145 82 128 78 111 81
      C93 84 82 95 82 108
      C82 123 96 130 119 137
      L139 143
      C153 147 158 153 158 162
      C158 173 147 180 131 181
      C113 182 98 176 86 166
      L76 181
      C90 195 109 202 132 202
      C163 202 181 186 181 163
      C181 142 165 133 142 126
      L121 120
      C108 116 104 112 104 106
      C104 99 111 94 122 93
      C135 92 147 96 157 103
      L168 88
      C165 85 162 83 158 81
      Z
    "
            fill="url(#blue)"
    />

    <!-- Open book -->
    <path
            d="M128 202
       C108 187 88 181 62 184
       V224
       C87 221 108 226 128 242
       C148 226 169 221 194 224
       V184
       C168 181 148 187 128 202Z"
            fill="white"
            filter="url(#shadow)"
    />

    <!-- Left book page -->
    <path
            d="M128 202
       C108 187 88 181 62 184
       V224
       C87 221 108 226 128 242V202Z"
            fill="#EAF3FF"
    />

    <!-- Right book page -->
    <path
            d="M128 202
       C148 187 168 181 194 184
       V224
       C169 221 148 226 128 242V202Z"
            fill="#FFFFFF"
    />

    <!-- Book center -->
    <path
            d="M128 202V242"
            stroke="#0B3FAE"
            stroke-width="4"
            stroke-linecap="round"
    />

    <!-- Gold page accent -->
    <path
            d="M128 202
       C148 187 168 181 194 184"
            stroke="url(#gold)"
            stroke-width="7"
            stroke-linecap="round"
    />

    <!-- Small page accents -->
    <path
            d="M75 195C91 194 106 199 120 207"
            stroke="#C8DCF7"
            stroke-width="4"
            stroke-linecap="round"
    />

    <path
            d="M181 195C165 194 150 199 136 207"
            stroke="#D9E8FA"
            stroke-width="4"
            stroke-linecap="round"
    />

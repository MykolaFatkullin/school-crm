version: '3.8'

services:
  db:
    image: postgres:15
    container_name: school-crm-db
    restart: always
    environment:
      POSTGRES_DB: school_crm
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
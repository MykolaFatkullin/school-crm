name: AI Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read prompts
        id: prompts
        run: |
          {
            echo "context<<EOF"
            cat .github/ai/context.md
            echo EOF

            echo "reviewer<<EOF"
            cat .github/ai/reviewer.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: AI Review
        uses: openai/openai-codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

          prompt: |
            ${{ steps.prompts.outputs.context }}

            ---

            ${{ steps.prompts.outputs.reviewer }}

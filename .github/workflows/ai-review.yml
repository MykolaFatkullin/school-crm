name: AI Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Generate diff
        run: |
         git diff origin/${{ github.base_ref }}...HEAD > diff.txt

      - name: Load prompts
        run: |
          echo "PROJECT_CONTEXT<<EOF" >> $GITHUB_ENV
          cat .github/ai/context.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "REVIEW_PROMPT<<EOF" >> $GITHUB_ENV
          cat .github/ai/reviewer.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

name: AI Review

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  review:
    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Review
        uses: MykolaFatkullin/ai-review-action@master
        with:
          github-token: ${{ secrets.AI_REVIEW_BOT_TOKEN }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-bot-login: EzioAuditoreReviewer
          model: gpt-5
          prompt-path: .github/ai
          exclude-files: |
            **/*.pem
            **/*.json
            **/*.md

name: AI Review

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

  issue_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  review:
    if: |
      github.event_name == 'issue_comment' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: MykolaFatkullin/ai-review-action@master
        with:
          github-token: ${{ secrets.AI_REVIEW_BOT_TOKEN }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-bot-login: EzioAuditoreReviewer
          model: gpt-5
          prompt-path: .github/ai
          exclude-files: |
            **/*.pem
            **/*.json
            **/*.md

spring:
  application:
    name: school-crm
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: ${DB_URL}
  jpa:
    hibernate:
      ddl-auto: none
  web:
    locale: en_US
    locale-resolver: fixed
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_MAIL}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
app:
  default-email: schoolcrm@crm.com
  frontend-url: http://localhost:5173
  mail-token-expiration-in-minutes: 1440
  reset-password-expiration-in-minutes: 30
  expired-token-cleanup-after-hours: 24
  cookies:
    secure: false

security:
  encryption:
    key: ${ENCRYPTION_KEY}
  jwt:
    expiration-in-ms: 60000
    refresh-token-expiration-in-days: 7
    private-key-path: file:${JWT_PRIVATE_KEY_PATH}
    public-key-path: file:${JWT_PUBLIC_KEY_PATH}
    password-change-leeway-seconds: 2
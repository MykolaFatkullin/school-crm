spring:
  application:
    name: school-crm
  datasource:
    driver-class-name: org.postgresql.Driver
    username: user
    password: password
    url: jdbc:postgresql://localhost:5432/school_crm
  jpa:
    hibernate:
      ddl-auto: none
  web:
    locale: en_US
    locale-resolver: fixed
  mail:
    host: smtp.gmail.com
    port: 587
    username:
    password:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
app:
  default-email: schoolcrm@crm.com
  frontend-url: http://localhost:5173
  mail-token-expiration-in-minutes: 1440
  reset-password-expiration-in-minutes: 30
  cookies:
    secure: false

jwt:
  expiration-in-ms: 60000
  private-key-path: keys/private_key.pem
  public-key-path: keys/public_key.pem

